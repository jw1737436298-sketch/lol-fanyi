[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lol-translate-overlay"
version = "0.1.0"
description = "Windows floating overlay for bidirectional League of Legends chat translation."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "PySide6>=6.7.0",
  "openai>=1.40.0",
  "python-dotenv>=1.0.1",
  "keyboard>=0.13.5",
  "pyperclip>=1.9.0",
  "deepl>=1.18.0",
]

[project.scripts]
lol-translate-overlay = "lol_translate_overlay.app:main"

[tool.setuptools.packages.find]
where = ["src"]

